name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  kit-tests:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/IPTVKit
        run: swift test

  apple:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Require Xcode 27
        run: |
          v="$(xcodebuild -version)"
          echo "$v"
          case "$v" in
            "Xcode 27"*) ;;
            *) echo "Xcode 27 required"; exit 1 ;;
          esac
      # Filled in by later tasks (build and UI tests).
