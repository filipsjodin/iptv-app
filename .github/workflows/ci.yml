name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  kit-tests:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/IPTVKit
        run: swift test

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Require Xcode 27
        run: |
          xcodebuild -version
          xcodebuild -version | head -n1 | grep -q '^Xcode 27' || { echo "Xcode 27 required"; exit 1; }
      # Filled in by later tasks (build and UI tests).
