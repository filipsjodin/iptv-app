name: IPTV

options:
  bundleIdPrefix: se.sjodin.iptv
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    tvOS: "27.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  IPTVKit:
    path: ../Packages/IPTVKit
  IPTVPlatform:
    path: ../Packages/IPTVPlatform
  IPTVPlayback:
    path: ../Packages/IPTVPlayback

settings:
  base:
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  IPTV-iOS:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sjodin.iptv.ios
        PRODUCT_MODULE_NAME: IPTVApp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Som AppInfo.plist plus UIBackgroundModes=audio (bild-i-bild och ljud i bakgrunden).
        INFOPLIST_FILE: Config/iOSAppInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: IPTV
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: IPTVKit
        product: Core
      - package: IPTVKit
        product: Providers
      - package: IPTVPlatform
        product: Library
      - package: IPTVPlatform
        product: Secrets
      - package: IPTVKit
        product: PlaybackCore
      - package: IPTVKit
        product: Personal
      - package: IPTVKit
        product: Metadata
      - package: IPTVKit
        product: Discovery
      - package: IPTVPlayback
        product: Playback
      - package: IPTVPlayback
        product: VLCEngine

  IPTV-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "27.0"
    sources:
      - path: Shared
      - path: TV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sjodin.iptv.tv
        PRODUCT_MODULE_NAME: IPTVApp
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/AppInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: IPTV
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: IPTVKit
        product: Core
      - package: IPTVKit
        product: Providers
      - package: IPTVPlatform
        product: Library
      - package: IPTVPlatform
        product: Secrets
      - package: IPTVKit
        product: PlaybackCore
      - package: IPTVKit
        product: Personal
      - package: IPTVKit
        product: Metadata
      - package: IPTVKit
        product: Discovery
      - package: IPTVPlayback
        product: Playback
      - package: IPTVPlayback
        product: VLCEngine

  IPTV-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: SharedTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sjodin.iptv.ios.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: IPTV-iOS
      # Core, Providers, Library, GRDB, PlaybackCore, Personal, Metadata, Discovery, Playback och VLCEngine länkas
      # bara in i värdappen. Att länka dem även här ger dubbla kopior av typerna i testbundeln (t.ex. ProviderError), så att casts i appen misslyckas.
      - package: IPTVKit
        product: ProvidersTestSupport

schemes:
  IPTV-iOS:
    build:
      targets:
        IPTV-iOS: all
        IPTV-iOSTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - IPTV-iOSTests
    run:
      config: Debug
    archive:
      config: Release
  IPTV-tvOS:
    build:
      targets:
        IPTV-tvOS: all
    run:
      config: Debug
    archive:
      config: Release
